<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Média, Moda e Mediana</title><style>:root{--bg:#eef4f8;--card:#fff;--ink:#162033;--muted:#637083;--p:#4f46e5;--p2:#0ea5e9;--line:#dbe4ec;--ok:#15803d;--okbg:#ecfdf3;--bad:#9a3412;--badbg:#fff7ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:radial-gradient(circle at 10% 0,#e9e7ff 0,transparent 28%),radial-gradient(circle at 90% 5%,#dff6ff 0,transparent 28%),var(--bg);color:var(--ink)}button{font:inherit}.app{height:100dvh;padding:1.2vh 1.2vw;display:grid;place-items:center}.deck{width:min(97vw,calc(96dvh*16/9));height:min(96dvh,calc(97vw*9/16));aspect-ratio:16/9;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px #1e293b20;overflow:hidden;position:relative}.top{height:10%;display:flex;align-items:center;gap:1.3vw;padding:0 3%;border-bottom:1px solid var(--line);position:relative}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:24px;font-weight:900}.title{flex:1}.title b{display:block;font-size:clamp(15px,1.25vw,22px)}.title span{font-size:clamp(10px,.78vw,14px);color:var(--muted)}.score,.count{padding:8px 12px;border-radius:999px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;font-weight:800;font-size:clamp(11px,.85vw,15px)}.bar{height:7px;background:#edf2f7}.bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--p),var(--p2));transition:.25s}.slides{height:81%;position:relative}.slide{position:absolute;inset:0;display:none;grid-template-columns:1.08fr .92fr;gap:3.6%;align-items:center;padding:3% 4.2%}.slide.on{display:grid;animation:in .2s ease}@keyframes in{from{opacity:.2;transform:translateX(12px)}to{opacity:1;transform:none}}.tag{display:inline-block;background:#eef2ff;color:var(--p);font-weight:900;font-size:clamp(11px,.82vw,15px);padding:7px 10px;border-radius:999px;margin-bottom:1vh}h1{font-size:clamp(28px,3vw,54px);line-height:1.02;letter-spacing:-.025em;margin:0 0 1.3vh}.prompt{font-size:clamp(16px,1.45vw,27px);line-height:1.35;color:#465468;margin:0 0 1.4vh}.data{display:flex;flex-wrap:wrap;gap:.65vw;margin:1.3vh 0}.v{min-width:clamp(50px,4vw,80px);padding:clamp(10px,1vw,16px) clamp(12px,1.2vw,20px);text-align:center;border:2px solid var(--line);background:#fff;border-radius:16px;font-size:clamp(20px,2vw,36px);font-weight:900}.v.hot{border-color:#818cf8;background:#eef2ff;color:#3730a3}.hint,.formula{margin-top:1vh;border-radius:16px;padding:clamp(10px,1vw,16px);font-size:clamp(13px,1vw,18px)}.hint{background:#f8fafc;border:1px solid var(--line);color:var(--muted)}.formula{background:linear-gradient(135deg,#eef2ff,#eff9ff);border:1px solid #dbeafe;text-align:center;color:#312e81;font-size:clamp(19px,1.8vw,33px);font-weight:900}.panel{border:1px solid var(--line);background:linear-gradient(#fcfdff,#f8fafc);border-radius:22px;padding:5%;display:flex;flex-direction:column;justify-content:center;min-height:55%}.panel h2{font-size:clamp(16px,1.3vw,24px);margin:0 0 1vh}.answers{display:grid;grid-template-columns:1fr 1fr;gap:.75vw}.ans{border:2px solid var(--line);background:#fff;border-radius:15px;padding:clamp(11px,1vw,17px);font-size:clamp(14px,1.08vw,20px);font-weight:850;min-height:56px;color:var(--ink);touch-action:manipulation}.ans.ok{border-color:#86efac;background:var(--okbg);color:#166534}.ans.no{border-color:#fdba74;background:var(--badbg);color:var(--bad)}.fb{margin-top:1vh;min-height:66px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:clamp(10px,1vw,16px);font-size:clamp(13px,1vw,18px);line-height:1.35;color:#465468;display:flex;align-items:center}.fb.ok{background:var(--okbg);border-color:#bbf7d0;color:#166534}.fb.no{background:var(--badbg);border-color:#fed7aa;color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}.m{padding:1vw;border:1px solid var(--line);border-radius:16px;text-align:center}.m small{color:var(--muted);font-weight:800}.m b{display:block;font-size:clamp(20px,1.8vw,34px);margin-top:.4vh}.foot{height:9%;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3%}.nav{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 17px;font-weight:850;color:var(--ink)}.nav.next{justify-self:end;background:var(--p);border-color:var(--p);color:white}.nav:disabled{opacity:.35}.help{font-size:clamp(10px,.75vw,13px);color:var(--muted);text-align:center}@media(max-width:900px){.slide{padding:2.5% 3%;gap:2.4%}.logo{width:38px;height:38px}.title span{display:none}.ans{min-height:48px}.score{display:none}}@media(max-width:650px) and (orientation:portrait){.deck{width:98vw;height:96dvh;aspect-ratio:auto}.slide{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}.panel{min-height:auto}.help{display:none}}</style></head><body><div class="app"><main class="deck"><header class="top"><div class="logo">Σ</div><div class="title"><b>Medidas de Tendência Central</b><span>Média • Mediana • Moda</span></div><div class="score">Acertos: <strong id="score">0</strong>/10</div><div class="count" id="count">1/10</div></header><div class="bar"><i id="bar"></i></div><div class="slides" id="slides"></div><footer class="foot"><button class="nav" id="prev">← Voltar</button><div class="help">Toque na resposta • use ← → no teclado</div><button class="nav next" id="next">Próximo →</button></footer></main></div><script>const Q=[{t:'MÉDIA',h:'Qual é o ponto de equilíbrio?',p:'Observe os valores e escolha a média.',d:[3,5,7],a:['4','5','6','7'],c:1,x:'(3 + 5 + 7) ÷ 3 = 5. A média funciona como um ponto de equilíbrio.',f:'Média = soma ÷ quantidade'},{t:'MÉDIA',h:'Agora calcule a média.',p:'Some todos os valores e divida pela quantidade de dados.',d:[4,6,8,10],a:['6','6,5','7','8'],c:2,x:'4 + 6 + 8 + 10 = 28. Como são 4 valores, 28 ÷ 4 = 7.',hint:'Dica: o total é 28.'},{t:'MEDIANA',h:'Qual valor fica no meio?',p:'A mediana só aparece corretamente depois que os dados estão em ordem.',d:[9,2,6,3,5],a:['3','4','5','6'],c:2,x:'Ordenando: 2, 3, 5, 6, 9. O 3º termo é 5, então a mediana é 5.',hint:'Organize mentalmente do menor para o maior.'},{t:'MEDIANA',h:'E quando há dois valores centrais?',p:'Em uma lista com quantidade par, use a média dos dois valores do meio.',d:[2,4,5,8],hot:[1,2],a:['4','4,5','5','6'],c:1,x:'Os dois termos centrais são 4 e 5. Então (4 + 5) ÷ 2 = 4,5.',f:'(4 + 5) ÷ 2 = ?'},{t:'MODA',h:'Qual valor aparece mais?',p:'Moda é o valor com maior frequência.',d:[2,4,4,4,5,7],a:['2','4','5','7'],c:1,x:'O número 4 aparece 3 vezes, mais do que qualquer outro valor. Logo, a moda é 4.',hint:'Conte quantas vezes cada número aparece.'},{t:'MODA',h:'Um conjunto pode ter duas modas.',p:'Observe a frequência dos valores.',d:[2,2,5,5,8],a:['Moda = 2','Moda = 5','Modas = 2 e 5','Não existe moda'],c:2,x:'2 e 5 aparecem duas vezes cada. Como empatam na maior frequência, o conjunto é bimodal.',hint:'Procure os valores mais frequentes.'},{t:'VALOR EXTREMO',h:'Qual medida é mais afetada?',p:'Compare 4, 5, 5, 6, 5 com 4, 5, 5, 6, 50.',metrics:[['ANTES','média 5'],['DEPOIS','média 14'],['MEDIANA','5']],a:['Média','Mediana','Moda','Todas igualmente'],c:0,x:'O 50 puxa a média para cima porque a média usa todos os valores. A mediana permanece 5.'},{t:'ESCOLHA DA MEDIDA',h:'Qual medida representa melhor estes salários?',p:'Queremos representar o salário típico do grupo.',d:[1500,1700,1800,1900,25000],hot:[4],a:['Média','Mediana','Moda','Amplitude'],c:1,x:'R$ 25.000 é um valor extremo. A mediana representa melhor o salário típico porque é menos afetada por esse valor.'},{t:'COMPARAÇÃO',h:'Encontre as três medidas.',p:'Conjunto: 2, 3, 3, 4, 8',d:[2,3,3,4,8],a:['M=3 • Md=3 • Mo=4','M=4 • Md=4 • Mo=3','M=3 • Md=4 • Mo=3','M=4 • Md=3 • Mo=3'],c:3,x:'Média = 20 ÷ 5 = 4; mediana = 3; moda = 3.'},{t:'DESAFIO FINAL',h:'Qual medida representa melhor o conjunto?',p:'Observe especialmente o valor 35.',d:[3,4,4,5,5,5,6,35],hot:[7],a:['Média','Mediana','Moda','Nenhuma'],c:1,x:'Moda = 5, mediana = 5 e média = 8,375. O 35 aumenta a média; por isso a mediana representa melhor o centro típico.'}];let i=0,score=0,done=Array(10).fill(false);const slides=document.getElementById('slides');function draw(){slides.innerHTML=Q.map((q,n)=>`<section class="slide ${n===0?'on':''}" data-i="${n}"><div><span class="tag">EXERCÍCIO ${n+1} • ${q.t}</span><h1>${q.h}</h1><p class="prompt">${q.p}</p>${q.d?`<div class="data">${q.d.map((v,k)=>`<div class="v ${q.hot&&q.hot.includes(k)?'hot':''}">${v}</div>`).join('')}</div>`:''}${q.metrics?`<div class="metrics">${q.metrics.map(m=>`<div class="m"><small>${m[0]}</small><b>${m[1]}</b></div>`).join('')}</div>`:''}${q.f?`<div class="formula">${q.f}</div>`:''}${q.hint?`<div class="hint">${q.hint}</div>`:''}</div><div class="panel"><h2>Escolha uma resposta</h2><div class="answers">${q.a.map((a,k)=>`<button class="ans" data-k="${k}">${a}</button>`).join('')}</div><div class="fb">💡 Pense antes de responder.</div></div></section>`).join('');document.querySelectorAll('.slide').forEach((s,n)=>s.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(n,+b.dataset.k)));show(0)}function answer(n,k){const s=document.querySelectorAll('.slide')[n],q=Q[n],bs=[...s.querySelectorAll('.ans')],fb=s.querySelector('.fb');bs.forEach(b=>b.classList.remove('ok','no'));if(k===q.c){bs[k].classList.add('ok');fb.className='fb ok';fb.innerHTML='✅ <b>Correto!</b>&nbsp;'+q.x;if(!done[n]){done[n]=true;score++;document.getElementById('score').textContent=score}}else{bs[k].classList.add('no');fb.className='fb no';fb.innerHTML='💡 <b>Ainda não.</b>&nbsp;Observe os dados e tente novamente.'}}function show(n){i=Math.max(0,Math.min(9,n));document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('count').textContent=`${i+1}/10`;document.getElementById('bar').style.width=`${(i+1)*10}%`;document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===9?'Recomeçar ↻':'Próximo →'}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>{if(i===9){score=0;done.fill(false);document.getElementById('score').textContent=0;draw()}else show(i+1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});draw();</script></body></html>
