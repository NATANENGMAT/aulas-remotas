<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Média, Moda e Mediana — Projetor</title><style>:root{--ink:#172033;--muted:#667085;--line:#dbe4ee;--violet:#5b4df0;--blue:#1597e5;--good:#166534;--goodbg:#ecfdf3;--bad:#9a3412;--badbg:#fff7ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#eef3f8}body{overflow:hidden}.app{position:relative;background:#fff;overflow:hidden}.progress{position:absolute;left:0;right:0;top:0;height:7px;background:#e8eef5;z-index:20}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));transition:.25s}.slide{position:absolute;display:none;background:radial-gradient(circle at 8% 6%,#5b4df015,transparent 25%),radial-gradient(circle at 95% 5%,#1597e512,transparent 23%),#fff}.slide.on{display:flex;animation:enter .2s ease}@keyframes enter{from{opacity:.15;transform:translateX(12px)}to{opacity:1;transform:none}}.tag{display:inline-block;align-self:flex-start;padding:7px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:900;letter-spacing:.03em}.copytag{background:#fff7df;color:#8a4f00}h1,h2{margin:0;letter-spacing:-.035em;line-height:1.04}.lead{margin:0;color:#4d5a70;line-height:1.42}.cards,.three,.steps{display:grid}.card,.concept,.steps>div{border:1px solid var(--line);border-radius:20px;background:#fff}.card{text-align:center}.card em,.steps em{display:grid;place-items:center;margin:auto;border-radius:50%;background:#eef2ff;color:#4338ca;font-style:normal;font-weight:900}.card small,.steps small{display:block;color:var(--muted)}.notebook{position:relative;border:2px solid #f2d28e;border-radius:19px;background:#fffdf7}.notebook:before{content:"";position:absolute;inset:0;border-radius:17px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#447bb41c 32px);pointer-events:none}.notebook p{position:relative;z-index:1;margin:.45em 0;line-height:1.45}.why,.callout{border-left:5px solid var(--blue);border-radius:14px;background:#f0f9ff;line-height:1.4}.dataset,.sortzone{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}.dataset span,.tile{display:grid;place-items:center;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;box-shadow:0 5px 14px #1e293b0a}.dataset.sorted span{background:#f8fafc}.dataset .focus{background:#eaf7ff;border-color:#38bdf8;color:#075985}.sortwrap{border:2px dashed #cbd5e1;background:#f8fafc;border-radius:20px}.sortlabel{font-weight:900;color:#475569;text-align:center}.sorthelp{text-align:center;color:var(--muted)}.tile{cursor:grab;touch-action:none;user-select:none;transition:.12s}.tile.dragging{opacity:.45;transform:scale(.96)}.tile.selected{outline:4px solid #c7d2fe;border-color:#6366f1;background:#eef2ff}.tile.locked{cursor:default;background:#ecfdf3;border-color:#86efac;color:#166534}.answers{display:grid;grid-template-columns:1fr 1fr}.answers button{border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.answers button:disabled{opacity:.4;cursor:not-allowed}.answers button.correct{border-color:#86efac;background:var(--goodbg);color:var(--good)}.answers button.wrong{border-color:#fdba74;background:var(--badbg);color:var(--bad)}.feedback{border:1px solid var(--line);border-radius:15px;background:#f8fafc;color:#4d5a70;line-height:1.4}.feedback.good{border-color:#bbf7d0;background:var(--goodbg);color:var(--good)}.feedback.bad{border-color:#fed7aa;background:var(--badbg);color:var(--bad)}.checkrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.checkbtn{border:0;border-radius:14px;background:var(--violet);color:#fff;font-weight:900;cursor:pointer}.resetbtn{border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:850;cursor:pointer}.navbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:#fffc}.navbar button{border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:850}.navbar .next{background:var(--violet);border-color:var(--violet);color:#fff}.navbar button:disabled{opacity:.35}.status{color:var(--muted);font-weight:800;text-align:center}.status strong{color:var(--violet)}:root{--navh:8.5%}body{display:grid;place-items:center;padding:1.2vh 1.2vw}.app{width:min(97vw,calc(95vh*16/9));height:min(95vh,calc(97vw*9/16));aspect-ratio:16/9;border:1px solid #d9e3ed;border-radius:26px;box-shadow:0 24px 70px #1e293b24}.slide{inset:0 0 var(--navh) 0;padding:4% 5.2% 3%;flex-direction:column;justify-content:center;gap:1vh}.navbar{height:var(--navh);padding:0 3.2%}.navbar button{padding:.7vw 1.25vw;font-size:clamp(12px,.95vw,18px)}.status{font-size:clamp(11px,.85vw,16px)}h1,h2{font-size:clamp(30px,2.8vw,50px)}.intro h1{font-size:clamp(34px,3.3vw,62px)}.lead{font-size:clamp(18px,1.45vw,28px)}.cards{grid-template-columns:repeat(4,1fr);gap:1vw}.card,.steps>div{padding:1.25vw}.card em,.steps em{width:2.3vw;height:2.3vw;min-width:32px;min-height:32px}.notebook{padding:1.1vw 1.4vw}.notebook p{font-size:clamp(16px,1.22vw,23px)}.why,.callout{padding:.9vw 1.1vw;font-size:clamp(14px,1.02vw,19px)}.dataset,.sortzone{gap:.62vw;margin:.8vh 0}.dataset span,.tile{min-width:4.1vw;padding:.68vw .9vw;font-size:clamp(21px,1.9vw,36px)}.sortwrap{padding:.8vw 1vw;width:min(900px,90%);margin:0 auto}.sortlabel{font-size:clamp(13px,1vw,18px)}.sorthelp{font-size:clamp(11px,.8vw,15px)}.answers{gap:.7vw;width:min(780px,85%);margin:0 auto}.answers button{padding:.78vw 1vw;min-height:54px;font-size:clamp(14px,1.04vw,19px)}.feedback{padding:.78vw 1vw;width:min(780px,85%);margin:0 auto;font-size:clamp(13px,.95vw,17px);min-height:50px}.checkbtn,.resetbtn{padding:.7vw 1vw;font-size:clamp(13px,1vw,18px)}.three{grid-template-columns:repeat(3,1fr);gap:1vw}.concept{padding:1.2vw}.steps{grid-template-columns:repeat(4,1fr);gap:1vw}.question{padding:.75em 1em;border:1px solid #dbe4ee;border-radius:14px;background:#f8fafc;font-weight:800;line-height:1.35;color:#344054}.question.locked{opacity:.45}.question strong{color:#5b4df0}</style></head><body><div class="app"><div class="progress"><i id="prog"></i></div><main id="slides"></main><nav class="navbar"><button id="prev">← Voltar</button><div class="status"><span id="count"></span> • Acertos: <strong id="scoreText">0/16</strong></div><button id="next" class="next">Próximo →</button></nav></div><script>const Q=[["ROL", [8,3,5,2,5], "Depois de ordenar, qual valor ocupa a 3ª posição do ROL?", ["3","5","8","2"], 1, "ROL: 2, 3, 5, 5, 8. O 3º valor é 5."],["MEDIANA", [9,1,7,4,6], "Qual é a mediana desse conjunto?", ["4","5","6","7"], 2, "ROL: 1, 4, 6, 7, 9. O valor central é 6."],["MEDIANA", [10,2,6,4], "Qual é a mediana?", ["4","5","6","8"], 1, "ROL: 2, 4, 6, 10. Os centrais são 4 e 6; (4 + 6) ÷ 2 = 5."],["MODA", [7,2,7,3,9,7], "Qual é a moda?", ["3","6","7","9"], 2, "ROL: 2, 3, 7, 7, 7, 9. A moda é 7."],["MODA BIMODAL", [5,2,8,5,2], "Qual alternativa descreve corretamente a moda?", ["Moda = 2","Moda = 5","Não há moda","Modas = 2 e 5"], 3, "ROL: 2, 2, 5, 5, 8. Há duas modas: 2 e 5."],["SEM MODA", [9,3,7,1,5], "O que podemos afirmar sobre a moda?", ["Moda = 1","Moda = 5","Moda = 9","Não há moda"], 3, "ROL: 1, 3, 5, 7, 9. Todos aparecem uma vez; não há moda."],["MÉDIA", [10,4,8,6], "Qual é a média aritmética?", ["6","6,5","7","8"], 2, "ROL: 4, 6, 8, 10. Soma = 28; 28 ÷ 4 = 7."],["MÉDIA DECIMAL", [9,2,7,4], "Qual é a média aritmética?", ["5","5,5","6","6,5"], 1, "ROL: 2, 4, 7, 9. Soma = 22; 22 ÷ 4 = 5,5."],["AS TRÊS MEDIDAS", [8,3,2,3,4], "Qual trio está correto?", ["M=3 • Md=3 • Mo=4","M=4 • Md=4 • Mo=3","M=3 • Md=4 • Mo=3","M=4 • Md=3 • Mo=3"], 3, "ROL: 2, 3, 3, 4, 8. Média = 4, mediana = 3 e moda = 3."],["MEDIANA COM REPETIÇÕES", [7,4,5,4,8,5], "Qual é a mediana?", ["4","4,5","5","5,5"], 2, "ROL: 4, 4, 5, 5, 7, 8. Os centrais são 5 e 5; mediana = 5."],["VALOR EXTREMO", [50,5,4,6,5], "Qual medida é mais afetada pelo valor 50?", ["Média","Mediana","Moda","Todas igualmente"], 0, "ROL: 4, 5, 5, 6, 50. O 50 puxa principalmente a média."],["ESCOLHA DA MEDIDA", [25000,1700,1900,1500,1800], "Qual medida representa melhor o salário típico?", ["Média","Mediana","Moda","Amplitude"], 1, "ROL: 1500, 1700, 1800, 1900, 25000. A mediana representa melhor o salário típico."],["APLICAÇÃO • CALÇADOS", [39,38,40,38,37,38], "Para saber o número de calçado mais vendido, qual medida é mais útil?", ["Média","Mediana","Moda","Amplitude"], 2, "ROL: 37, 38, 38, 38, 39, 40. A moda é 38, o tamanho mais frequente."],["MEDIANA E EXTREMO", [90,22,18,25,22,24,20], "Qual é a mediana?", ["22","24","25","31,6"], 0, "ROL: 18, 20, 22, 22, 24, 25, 90. O valor central é 22."],["QUAL MEDIDA USAR?", [9,7,6,8,7], "Sem valor extremo e querendo um resumo geral das notas, qual medida é adequada?", ["Média","Mediana apenas","Moda apenas","Amplitude"], 0, "ROL: 6, 7, 7, 8, 9. A média é uma medida adequada para resumir o desempenho geral."],["DESAFIO FINAL", [35,5,4,3,5,6,4,5], "Qual alternativa está totalmente correta?", ["Média=5 • Md=5 • Mo=5","Média=8,375 • Md=5 • Mo=5; mediana representa melhor o centro típico","Média=8,375 • Md=6 • Mo=4","Média=5 • Md=8,375 • Mo=35"], 1, "ROL: 3, 4, 4, 5, 5, 5, 6, 35. Média = 67 ÷ 8 = 8,375; mediana = 5; moda = 5. O 35 puxa a média, então a mediana representa melhor o centro típico."]];const info=[{t:'intro',tag:'AULA • MEDIDAS DE TENDÊNCIA CENTRAL',h:'Primeiro organize. Depois calcule.',p:'A aula tem <strong>20 etapas</strong>: 3 explicações, <strong>16 exercícios interativos</strong> e 1 fechamento. Em cada exercício, monte primeiro o <strong>ROL crescente</strong>; só depois o cálculo será liberado.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'O que é ROL?',body:['<strong>ROL</strong> é a sequência dos dados colocados em ordem.','Nesta aula, usaremos <strong>ordem crescente</strong>: do menor para o maior.','Exemplo: 8, 3, 5, 2, 5 → <strong>2, 3, 5, 5, 8</strong>'],why:'A <strong>mediana depende da posição</strong>, por isso ordenar é obrigatório. O ROL também facilita enxergar a moda e organiza o cálculo da média.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Mediana, Moda e Média',body:['<strong>Mediana:</strong> valor central do ROL.','<strong>Moda:</strong> valor que mais se repete.','<strong>Média:</strong> soma de todos os valores ÷ quantidade de valores.'],why:'Sequência de trabalho: <strong>1) monte o ROL; 2) identifique mediana e moda; 3) calcule a média.</strong>'}];let score=0,current=0;const answered=Array(Q.length).fill(false),slides=document.getElementById('slides'),prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),scoreText=document.getElementById('scoreText');function introHTML(v,i){let b=`<div class="tag ${v.t==='copy'?'copytag':''}">${v.tag}</div><h1>${v.h}</h1>`;if(v.p)b+=`<p class="lead">${v.p}</p>`;if(v.body)b+=`<div class="notebook">${v.body.map(x=>`<p>${x}</p>`).join('')}</div>`;if(v.why)b+=`<div class="why">${v.why}</div>`;if(v.t==='intro')b+=`<div class="cards"><div class="card"><em>1</em><b>ARRASTE</b><small>monte o ROL</small></div><div class="card"><em>2</em><b>CONFIRA</b><small>valide a ordem</small></div><div class="card"><em>3</em><b>CALCULE</b><small>tendência central</small></div><div class="card"><em>4</em><b>EXPLIQUE</b><small>entenda o resultado</small></div></div>`;return `<section class="slide ${i===0?'on':''}" data-slide="${i}">${b}</section>`}function qHTML(q,qi,si){const [topic,vals,prompt,ans,corr,exp]=q;return `<section class="slide" data-slide="${si}" data-q="${qi}"><div class="tag">EXERCÍCIO ${qi+1}/16 • ${topic}</div><h2>1º monte o ROL crescente</h2><div class="sortwrap"><div class="sortlabel">Arraste os cartões para colocar do menor para o maior</div><div class="sortzone" aria-label="Área de ordenação">${vals.map((v,k)=>`<button type="button" class="tile" data-id="${k}" aria-label="Valor ${v}">${v}</button>`).join('')}</div><div class="sorthelp">No celular/iPad: arraste ou toque em dois cartões para trocar de posição.</div><div class="checkrow"><button type="button" class="checkbtn">Conferir ROL</button><button type="button" class="resetbtn">Embaralhar novamente</button></div></div><div class="feedback">Monte o ROL antes de responder.</div><div class="question locked"><strong>2º responda:</strong> ${prompt}</div><div class="answers">${ans.map((a,k)=>`<button type="button" data-a="${k}" disabled>${a}</button>`).join('')}</div></section>`}function build(){let h=info.map((v,i)=>introHTML(v,i)).join('');h+=Q.map((q,qi)=>qHTML(q,qi,qi+info.length)).join('');h+=`<section class="slide" data-slide="${Q.length+info.length}"><div class="tag">FECHAMENTO</div><h1>ROL primeiro. Tendência central depois.</h1><div class="steps"><div><em>1</em><b>ROL</b><small>ordene</small></div><div><em>2</em><b>MEDIANA</b><small>centro</small></div><div><em>3</em><b>MODA</b><small>frequência</small></div><div><em>4</em><b>MÉDIA</b><small>equilíbrio</small></div></div><div class="callout">Acertos: <strong id="finalScore">${score}/16</strong></div></section>`;slides.innerHTML=h;initQs();show(0)}function currentOrder(zone){return [...zone.querySelectorAll('.tile')].map(b=>Number(b.textContent))}function isSorted(a){return a.every((v,i)=>i===0||a[i-1]<=v)}function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}function initQs(){document.querySelectorAll('[data-q]').forEach(sec=>{const qi=Number(sec.dataset.q),zone=sec.querySelector('.sortzone'),fb=sec.querySelector('.feedback'),checks=sec.querySelector('.checkbtn'),reset=sec.querySelector('.resetbtn'),ans=[...sec.querySelectorAll('.answers button')];let selected=null,drag=null;function unlock(){zone.querySelectorAll('.tile').forEach(t=>t.classList.add('locked'));sec.querySelector('.question')?.classList.remove('locked');ans.forEach(b=>b.disabled=false);fb.className='feedback good';fb.innerHTML='✅ <strong>ROL correto!</strong> Agora responda a questão.'}function swap(a,b){if(a===b)return;const ph=document.createElement('span');a.replaceWith(ph);b.replaceWith(a);ph.replaceWith(b)}zone.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||t.classList.contains('locked'))return;drag=t;t.setPointerCapture?.(e.pointerId);t.classList.add('dragging')});zone.addEventListener('pointermove',e=>{if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(el&&el!==drag&&zone.contains(el)){const r=el.getBoundingClientRect();if(e.clientX<r.left+r.width/2)zone.insertBefore(drag,el);else zone.insertBefore(drag,el.nextSibling)}});zone.addEventListener('pointerup',e=>{if(drag){drag.classList.remove('dragging');drag=null}});zone.addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t||t.classList.contains('locked'))return;if(!selected){selected=t;t.classList.add('selected')}else{selected.classList.remove('selected');if(selected!==t)swap(selected,t);selected=null}});checks.onclick=()=>{if(isSorted(currentOrder(zone)))unlock();else{fb.className='feedback bad';fb.innerHTML='❌ Ainda não está em ordem crescente. Continue arrastando os cartões.'}};reset.onclick=()=>{ans.forEach(b=>{b.disabled=true;b.classList.remove('correct','wrong')});fb.className='feedback';fb.textContent='Monte o ROL antes de responder.';sec.querySelector('.question')?.classList.add('locked');const tiles=[...zone.children];shuffle(tiles).forEach(t=>{t.classList.remove('locked','selected','dragging');zone.appendChild(t)});selected=null};ans.forEach((b,k)=>b.onclick=()=>{ans.forEach(x=>x.classList.remove('correct','wrong'));const corr=Q[qi][4],exp=Q[qi][5];if(k===corr){b.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <strong>Correto!</strong> '+exp;if(!answered[qi]){answered[qi]=true;score++;scoreText.textContent=score+'/16'}}else{b.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='💡 Revise o ROL e tente novamente.'}});})}function show(n){const all=[...document.querySelectorAll('.slide')];current=Math.max(0,Math.min(all.length-1,n));all.forEach((s,k)=>s.classList.toggle('on',k===current));prog.style.width=((current+1)/all.length*100)+'%';count.textContent=(current+1)+' / '+all.length;prev.disabled=current===0;next.textContent=current===all.length-1?'Recomeçar ↻':'Próximo →';const fs=document.getElementById('finalScore');if(fs)fs.textContent=score+'/16'}prev.onclick=()=>show(current-1);next.onclick=()=>{const all=document.querySelectorAll('.slide');if(current===all.length-1){score=0;answered.fill(false);scoreText.textContent='0/16';build()}else show(current+1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});build();</script></body></html>
