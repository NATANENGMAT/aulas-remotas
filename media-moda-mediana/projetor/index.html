<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Média, Moda e Mediana — Projetor</title><style>:root{--v:#5b4df0;--b:#1597e5;--ink:#172033;--mut:#667085;--line:#dbe4ee;--g:#166534;--gb:#ecfdf3;--bad:#9a3412;--badb:#fff7ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#eaf0f6;color:var(--ink);overflow:hidden}body{display:grid;place-items:center;padding:1.2vh 1.2vw}.app{position:relative;width:min(97vw,calc(95vh*16/9));height:min(95vh,calc(97vw*9/16));aspect-ratio:16/9;background:#fff;border:1px solid #d9e3ed;border-radius:26px;box-shadow:0 24px 70px #1e293b24;overflow:hidden}.prog{position:absolute;top:0;left:0;right:0;height:7px;background:#e8eef5;z-index:9}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--b));width:5%;transition:.25s}.slide{position:absolute;inset:7px 0 8.5% 0;padding:4.2% 5.2% 3%;display:none;flex-direction:column;justify-content:center;gap:1.15vh;background:radial-gradient(circle at 8% 6%,#5b4df015,transparent 25%),radial-gradient(circle at 95% 5%,#1597e512,transparent 23%),#fff}.slide.on{display:flex}.tag{align-self:flex-start;padding:.45vw .75vw;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:900;font-size:clamp(11px,.82vw,15px)}.copy{background:#fff7df;color:#8a4f00}h1,h2{margin:0;letter-spacing:-.035em;line-height:1.04}h1{font-size:clamp(34px,3.3vw,62px)}h2{font-size:clamp(30px,2.8vw,50px)}.lead{margin:0;color:#4d5a70;font-size:clamp(18px,1.45vw,28px);line-height:1.42}.cards,.three,.steps{display:grid;gap:1vw}.cards,.steps{grid-template-columns:repeat(4,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card,.concept,.steps>div{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 25px #1e293b0b;padding:1.2vw;text-align:center}.card em,.steps em{display:grid;place-items:center;margin:auto;width:2.3vw;height:2.3vw;min-width:32px;min-height:32px;border-radius:50%;background:#eef2ff;color:#4338ca;font-style:normal;font-weight:900}.card b,.steps b,.concept b{display:block;font-size:clamp(16px,1.25vw,23px)}.card small,.steps small{color:var(--mut);font-size:clamp(11px,.85vw,15px)}.notebook{position:relative;padding:1.1vw 1.4vw;border:2px solid #f2d28e;border-radius:19px;background:#fffdf7}.notebook:before{content:"";position:absolute;inset:0;border-radius:17px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#447bb41c 32px);pointer-events:none}.notebook p{position:relative;z-index:1;margin:.45em 0;font-size:clamp(16px,1.22vw,23px);line-height:1.45}.why,.call{padding:.9vw 1.1vw;border-left:5px solid var(--b);border-radius:14px;background:#f0f9ff;font-size:clamp(14px,1.02vw,19px);line-height:1.4}.dataset{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.62vw;margin:1.1vh 0}.dataset span{display:grid;place-items:center;min-width:4.1vw;padding:.68vw .9vw;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;font-size:clamp(21px,1.9vw,36px)}.dataset.sorted span{background:#f8fafc}.dataset .focus{background:#eaf7ff;border-color:#38bdf8;color:#075985}.dataset .danger{background:#fff1f2;border-color:#fda4af;color:#be123c}.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.2vw;width:90%}.compare small{display:block;text-align:center;color:var(--mut);font-weight:900}.arrow{font-size:clamp(28px,2.8vw,50px);color:var(--v);font-weight:900}.formula{padding:.9vw 1.3vw;min-width:55%;border:1px solid #d8e2ff;border-radius:19px;background:linear-gradient(135deg,#eef2ff,#f0f9ff);text-align:center;color:#312e81;font-weight:900;font-size:clamp(21px,1.9vw,35px)}.note{text-align:center;font-size:clamp(16px,1.3vw,24px);margin:.3vh 0}.concept>span{display:block;font-size:clamp(26px,2.1vw,40px)}.concept p{margin:.4em 0 0;color:#536174;font-size:clamp(13px,.95vw,18px)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:.7vw;width:min(780px,85%)}.answers button{padding:.78vw 1vw;min-height:54px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:850;font-size:clamp(14px,1.04vw,19px);cursor:pointer}.answers button.correct{border-color:#86efac;background:var(--gb);color:var(--g)}.answers button.wrong{border-color:#fdba74;background:var(--badb);color:var(--bad)}.feedback{padding:.78vw 1vw;width:min(780px,85%);min-height:50px;border:1px solid var(--line);border-radius:15px;background:#f8fafc;color:#4d5a70;font-size:clamp(13px,.95vw,17px);line-height:1.4}.feedback.good{border-color:#bbf7d0;background:var(--gb);color:var(--g)}.feedback.bad{border-color:#fed7aa;background:var(--badb);color:var(--bad)}.nav{position:absolute;left:0;right:0;bottom:0;height:8.5%;display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;border-top:1px solid var(--line);background:#fffc}.nav button{padding:.7vw 1.25vw;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:850;font-size:clamp(12px,.95vw,18px)}.nav .next{background:var(--v);border-color:var(--v);color:#fff}.status{color:var(--mut);font-weight:800;font-size:clamp(11px,.85vw,16px)}.status strong{color:var(--v)}.finalscore{text-align:center;padding:.9vw;width:55%;border:1px solid #c7d2fe;border-radius:18px;background:#eef2ff;color:#3730a3;font-weight:850;font-size:clamp(18px,1.4vw,26px)}</style></head><body><div class="app"><div class="prog"><i id="prog"></i></div><main id="slides"></main><nav class="nav"><button id="prev">← Voltar</button><div class="status"><span id="count"></span> • Acertos: <strong id="score">0/10</strong></div><button id="next" class="next">Próximo →</button></nav></div><script>const S=[{t:'intro',tag:'AULA • MEDIDAS DE TENDÊNCIA CENTRAL',h:'Antes da média, moda e mediana: organize os dados.',p:'Hoje você vai transformar dados soltos em um <strong>ROL</strong> e, a partir dele, analisar o centro de um conjunto.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'O que é ROL?',body:['<strong>ROL</strong> é a sequência dos dados colocados em ordem.','Nesta aula, usaremos <strong>ordem crescente</strong>: do menor para o maior.','Dados: 8, 3, 5, 2, 5 → <strong>ROL: 2, 3, 5, 5, 8</strong>'],why:'<strong>Por que fazer o ROL primeiro?</strong> Porque a mediana depende da posição dos valores. Sem ordenar, podemos escolher o meio errado. O ROL também facilita enxergar repetições e a moda.'},{t:'visual',tag:'VISUALIZAÇÃO • ROL',h:'Os mesmos dados, agora organizados',raw:[8,3,5,2,5],sorted:[2,3,5,5,8],call:'<strong>Regra de ouro:</strong> recebeu uma lista de dados? Faça o ROL antes de procurar a mediana.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Mediana',body:['<strong>Mediana</strong> é o valor que fica no centro do <strong>ROL</strong>.','Quantidade ímpar: existe um único valor central.','Quantidade par: fazemos a média dos dois valores centrais.'],data:[2,3,5,6,9],focus:[2],note:'Mediana = <strong>5</strong>'},{t:'example',tag:'EXEMPLO • MEDIANA PAR',h:'Quando existem dois valores no centro',data:[2,4,5,8],focus:[1,2],formula:'(4 + 5) ÷ 2 = <strong>4,5</strong>',note:'Mediana = <strong>4,5</strong>'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Moda',body:['<strong>Moda</strong> é o valor que aparece com maior frequência.','Pode haver uma moda, duas ou mais modas, ou nenhuma moda.'],data:[2,4,4,4,5,7],focus:[1,2,3],note:'Moda = <strong>4</strong>, pois aparece 3 vezes.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Média aritmética',body:['<strong>Média</strong> é a soma de todos os valores dividida pela quantidade de valores.'],formula:'Média = soma dos valores ÷ quantidade de valores',note:'3, 5, 7 → (3 + 5 + 7) ÷ 3 = <strong>5</strong>',why:'<strong>Importante:</strong> ordenar não altera a média. Mesmo assim, nesta aula fazemos o ROL primeiro para organizar a análise.'},{t:'summary',tag:'📓 COPIE NO CADERNO',h:'Resumo das três medidas',call:'<strong>Ordem de trabalho:</strong> 1) faça o ROL; 2) identifique mediana e moda; 3) calcule a média.'},{t:'q',tag:'EXERCÍCIO 1/10 • ROL',h:'Qual é o ROL crescente?',data:[8,3,5,2,5],a:['8, 5, 5, 3, 2','2, 3, 5, 5, 8','2, 5, 3, 5, 8','3, 2, 5, 5, 8'],c:1,x:'O ROL é 2, 3, 5, 5, 8.'},{t:'q',tag:'EXERCÍCIO 2/10 • MEDIANA',h:'Qual é a mediana?',data:[9,1,7,4,6],a:['4','5','6','7'],c:2,x:'ROL: 1, 4, 6, 7, 9. O centro é 6.'},{t:'q',tag:'EXERCÍCIO 3/10 • MEDIANA',h:'Quantidade par: qual é a mediana?',data:[2,4,6,10],sorted:1,a:['4','5','6','8'],c:1,x:'Os centrais são 4 e 6: (4+6)÷2=5.'},{t:'q',tag:'EXERCÍCIO 4/10 • MODA',h:'Qual é a moda?',data:[2,3,7,7,7,9],sorted:1,a:['3','6','7','9'],c:2,x:'7 aparece 3 vezes.'},{t:'q',tag:'EXERCÍCIO 5/10 • MODA',h:'Qual alternativa descreve a moda?',data:[2,2,5,5,8],sorted:1,a:['Moda = 2','Moda = 5','Não há moda','Modas = 2 e 5'],c:3,x:'2 e 5 têm a maior frequência.'},{t:'q',tag:'EXERCÍCIO 6/10 • MÉDIA',h:'Qual é a média?',data:[4,6,8,10],a:['6','6,5','7','8'],c:2,x:'28 ÷ 4 = 7.'},{t:'q',tag:'EXERCÍCIO 7/10 • AS TRÊS',h:'Qual trio está correto?',data:[2,3,3,4,8],sorted:1,a:['Média 3 • Mediana 3 • Moda 4','Média 4 • Mediana 4 • Moda 3','Média 3 • Mediana 4 • Moda 3','Média 4 • Mediana 3 • Moda 3'],c:3,x:'Média 4; mediana 3; moda 3.'},{t:'q',tag:'EXERCÍCIO 8/10 • VALOR EXTREMO',h:'Qual medida é mais afetada pelo 50?',data:[4,5,5,6,50],sorted:1,danger:[4],a:['Média','Mediana','Moda','Todas igualmente'],c:0,x:'A média usa todos os valores e é puxada pelo 50.'},{t:'q',tag:'EXERCÍCIO 9/10 • APLICAÇÃO',h:'Qual medida representa melhor o salário típico?',data:[1500,1700,1800,1900,25000],sorted:1,danger:[4],a:['Média','Mediana','Moda','Amplitude'],c:1,x:'A mediana resiste ao salário extremo de 25.000.'},{t:'q',tag:'EXERCÍCIO 10/10 • DESAFIO',h:'Qual medida representa melhor o centro típico?',data:[3,4,4,5,5,5,6,35],sorted:1,danger:[7],a:['Média','Mediana','Moda','Nenhuma'],c:1,x:'A mediana é 5 e resiste ao valor extremo 35.'},{t:'final',tag:'FECHAMENTO',h:'Da lista bagunçada ao centro dos dados.'}];const el=document.getElementById('slides'),prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),scoreEl=document.getElementById('score');let i=0,score=0;const done=Array(S.length).fill(0);function ds(v){return '<div class="dataset '+(v.sorted?'sorted':'')+'">'+v.data.map((n,k)=>'<span class="'+(v.focus?.includes(k)?'focus ':'')+(v.danger?.includes(k)?'danger':'')+'">'+n+'</span>').join('')+'</div>'}function html(v,n){let c='<div class="tag '+(v.t==='copy'?'copy':'')+'">'+v.tag+'</div><h2>'+v.h+'</h2>';if(v.p)c+='<p class="lead">'+v.p+'</p>';if(v.t==='intro')c+='<div class="cards"><div class="card"><em>1</em><b>ROL</b><small>colocar em ordem</small></div><div class="card"><em>2</em><b>MEDIANA</b><small>achar o meio</small></div><div class="card"><em>3</em><b>MODA</b><small>mais frequente</small></div><div class="card"><em>4</em><b>MÉDIA</b><small>equilibrar valores</small></div></div>';if(v.body)c+='<div class="notebook">'+v.body.map(x=>'<p>'+x+'</p>').join('')+'</div>';if(v.raw)c+='<div class="compare"><div><small>DADOS BRUTOS</small>'+ds({data:v.raw})+'</div><div class="arrow">→</div><div><small>ROL CRESCENTE</small>'+ds({data:v.sorted,sorted:1})+'</div></div>';if(v.data)c+=ds(v);if(v.formula)c+='<div class="formula">'+v.formula+'</div>';if(v.note)c+='<p class="note">'+v.note+'</p>';if(v.why)c+='<div class="why">'+v.why+'</div>';if(v.call)c+='<div class="call">'+v.call+'</div>';if(v.t==='summary')c+='<div class="three"><div class="concept"><span>⚖️</span><b>MÉDIA</b><p>Soma e divide pela quantidade.</p></div><div class="concept"><span>🎯</span><b>MEDIANA</b><p>Centro do ROL.</p></div><div class="concept"><span>🔥</span><b>MODA</b><p>Valor mais frequente.</p></div></div>';if(v.t==='q')c+='<div class="answers">'+v.a.map((x,k)=>'<button data-k="'+k+'">'+x+'</button>').join('')+'</div><div class="feedback">Escolha uma alternativa.</div>';if(v.t==='final')c+='<div class="steps"><div><em>1</em><b>ROL</b><small>ordene</small></div><div><em>2</em><b>MEDIANA</b><small>ache o centro</small></div><div><em>3</em><b>MODA</b><small>veja repetições</small></div><div><em>4</em><b>MÉDIA</b><small>some e divida</small></div></div><div class="finalscore">Acertos: <strong id="finalScore">'+score+'/10</strong></div>';return '<section class="slide '+(n===0?'on':'')+'" data-n="'+n+'">'+c+'</section>'}function draw(){el.innerHTML=S.map(html).join('');document.querySelectorAll('.slide').forEach((s,n)=>{if(S[n].t==='q')s.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>answer(n,+b.dataset.k))});show(i)}function answer(n,k){const v=S[n],s=document.querySelector('.slide[data-n="'+n+'"]'),bs=[...s.querySelectorAll('.answers button')],fb=s.querySelector('.feedback');bs.forEach(b=>b.classList.remove('correct','wrong'));if(k===v.c){bs[k].classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <strong>Correto!</strong> '+v.x;if(!done[n]){done[n]=1;score++;scoreEl.textContent=score+'/10'}}else{bs[k].classList.add('wrong');fb.className='feedback bad';fb.innerHTML='💡 <strong>Tente novamente.</strong> Faça o ROL e reveja a ideia principal.'}}function show(n){i=Math.max(0,Math.min(S.length-1,n));document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===i));prog.style.width=((i+1)/S.length*100)+'%';count.textContent=(i+1)+' / '+S.length;prev.disabled=i===0;next.textContent=i===S.length-1?'Recomeçar ↻':'Próximo →';const f=document.getElementById('finalScore');if(f)f.textContent=score+'/10'}prev.onclick=()=>show(i-1);next.onclick=()=>{if(i===S.length-1){i=0;score=0;done.fill(0);scoreEl.textContent='0/10';draw()}else show(i+1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});draw();</script></body></html>
