<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Média, Moda e Mediana — Celular</title><style>
:root{--ink:#172033;--muted:#667085;--line:#dbe4ee;--violet:#5b4df0;--blue:#1597e5;--good:#166534;--goodbg:#ecfdf3;--bad:#9a3412;--badbg:#fff7ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#eef3f8}body{overflow:hidden}
.app{position:relative;background:#fff;overflow:hidden}.progress{position:absolute;left:0;right:0;top:0;height:7px;background:#e8eef5;z-index:20}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));transition:.25s}
.slide{position:absolute;display:none;background:radial-gradient(circle at 8% 6%,#5b4df015,transparent 25%),radial-gradient(circle at 95% 5%,#1597e512,transparent 23%),#fff}.slide.on{display:flex;animation:enter .2s ease}@keyframes enter{from{opacity:.15;transform:translateX(12px)}to{opacity:1;transform:none}}
.tag{display:inline-block;align-self:flex-start;padding:7px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:900;letter-spacing:.03em}.copytag{background:#fff7df;color:#8a4f00}
h1,h2{margin:0;letter-spacing:-.035em;line-height:1.04}.lead{margin:0;color:#4d5a70;line-height:1.42}
.cards,.three,.steps{display:grid}.card,.concept,.steps>div{border:1px solid var(--line);border-radius:20px;background:#fff}.card{text-align:center}.card em,.steps em{display:grid;place-items:center;margin:auto;border-radius:50%;background:#eef2ff;color:#4338ca;font-style:normal;font-weight:900}.card small,.steps small{display:block;color:var(--muted)}
.notebook{position:relative;border:2px solid #f2d28e;border-radius:19px;background:#fffdf7}.notebook:before{content:"";position:absolute;inset:0;border-radius:17px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#447bb41c 32px);pointer-events:none}.notebook p{position:relative;z-index:1;margin:.45em 0;line-height:1.45}
.why,.callout{border-left:5px solid var(--blue);border-radius:14px;background:#f0f9ff;line-height:1.4}
.dataset,.sortzone{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
.dataset span,.tile{display:grid;place-items:center;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;box-shadow:0 5px 14px #1e293b0a}
.dataset.sorted span{background:#f8fafc}.dataset .focus{background:#eaf7ff;border-color:#38bdf8;color:#075985}
.sortwrap{border:2px dashed #cbd5e1;background:#f8fafc;border-radius:20px}.sortlabel{font-weight:900;color:#475569;text-align:center}.sorthelp{text-align:center;color:var(--muted)}
.tile{cursor:grab;touch-action:none;user-select:none;transition:.12s}.tile.dragging{opacity:.45;transform:scale(.96)}.tile.selected{outline:4px solid #c7d2fe;border-color:#6366f1;background:#eef2ff}.tile.locked{cursor:default;background:#ecfdf3;border-color:#86efac;color:#166534}
.answers{display:grid;grid-template-columns:1fr 1fr}.answers button{border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.answers button:disabled{opacity:.4;cursor:not-allowed}.answers button.correct{border-color:#86efac;background:var(--goodbg);color:var(--good)}.answers button.wrong{border-color:#fdba74;background:var(--badbg);color:var(--bad)}
.feedback{border:1px solid var(--line);border-radius:15px;background:#f8fafc;color:#4d5a70;line-height:1.4}.feedback.good{border-color:#bbf7d0;background:var(--goodbg);color:var(--good)}.feedback.bad{border-color:#fed7aa;background:var(--badbg);color:var(--bad)}
.checkrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.checkbtn{border:0;border-radius:14px;background:var(--violet);color:#fff;font-weight:900;cursor:pointer}.resetbtn{border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:850;cursor:pointer}
.navbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:#fffc}.navbar button{border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:850}.navbar .next{background:var(--violet);border-color:var(--violet);color:#fff}.navbar button:disabled{opacity:.35}.status{color:var(--muted);font-weight:800;text-align:center}.status strong{color:var(--violet)}
:root{--navh:9.2%}.app{width:100vw;height:100svh;max-width:520px;margin:0 auto}.slide{inset:0 0 var(--navh) 0;padding:5.5vh 5.2vw 2.2vh;flex-direction:column;gap:1vh;overflow:auto;-webkit-overflow-scrolling:touch}.navbar{height:var(--navh);padding:0 4vw}.navbar button{padding:10px 13px;font-size:13px}.status{font-size:11px;max-width:42vw}.tag{font-size:11px}h1,h2{font-size:clamp(28px,8vw,40px)}.intro h1{font-size:clamp(30px,9vw,44px)}.lead{font-size:clamp(17px,4.8vw,22px)}.cards{grid-template-columns:1fr 1fr;gap:10px}.card,.steps>div{padding:12px}.card em,.steps em{width:34px;height:34px;font-size:15px}.card b,.steps b{font-size:15px}.card small,.steps small{font-size:11px}.notebook{padding:13px 14px}.notebook p{font-size:15px}.why,.callout{padding:11px 12px;font-size:14px}.dataset,.sortzone{gap:7px;margin:.7vh 0}.dataset span,.tile{min-width:48px;padding:10px 11px;font-size:22px}.sortwrap{padding:11px}.sortlabel{font-size:13px}.sorthelp{font-size:12px}.answers{gap:8px}.answers button{padding:12px 9px;min-height:52px;font-size:14px}.feedback{padding:11px 12px;font-size:13px;min-height:50px}.checkbtn,.resetbtn{padding:11px 14px}.three{grid-template-columns:1fr;gap:8px}.concept{padding:10px}.steps{grid-template-columns:1fr 1fr;gap:9px}.intro{justify-content:center}
</style></head><body>
<div class="app"><div class="progress"><i id="prog"></i></div><main id="slides"></main><nav class="navbar"><button id="prev">← Voltar</button><div class="status"><span id="count"></span> • Acertos: <strong id="scoreText">0/10</strong></div><button id="next" class="next">Próximo →</button></nav></div>
<script>
const Q=[["ROL", [8, 3, 5, 2, 5], ["8, 5, 5, 3, 2", "2, 3, 5, 5, 8", "2, 5, 3, 5, 8", "3, 2, 5, 5, 8"], 1, "O ROL correto é 2, 3, 5, 5, 8."], ["MEDIANA", [9, 1, 7, 4, 6], ["4", "5", "6", "7"], 2, "ROL: 1, 4, 6, 7, 9. O valor central é 6."], ["MEDIANA", [10, 2, 6, 4], ["4", "5", "6", "8"], 1, "ROL: 2, 4, 6, 10. Os centrais são 4 e 6; a mediana é 5."], ["MODA", [7, 2, 7, 3, 9, 7], ["3", "6", "7", "9"], 2, "ROL: 2, 3, 7, 7, 7, 9. A moda é 7."], ["MODA", [5, 2, 8, 5, 2], ["Moda = 2", "Moda = 5", "Não há moda", "Modas = 2 e 5"], 3, "ROL: 2, 2, 5, 5, 8. Há duas modas: 2 e 5."], ["MÉDIA", [10, 4, 8, 6], ["6", "6,5", "7", "8"], 2, "ROL: 4, 6, 8, 10. Média = 28 ÷ 4 = 7."], ["AS TRÊS MEDIDAS", [8, 3, 2, 3, 4], ["M=3 • Md=3 • Mo=4", "M=4 • Md=4 • Mo=3", "M=3 • Md=4 • Mo=3", "M=4 • Md=3 • Mo=3"], 3, "ROL: 2, 3, 3, 4, 8. Média 4, mediana 3, moda 3."], ["VALOR EXTREMO", [50, 5, 4, 6, 5], ["Média", "Mediana", "Moda", "Todas igualmente"], 0, "ROL: 4, 5, 5, 6, 50. O 50 puxa mais a média."], ["ESCOLHA DA MEDIDA", [25000, 1700, 1900, 1500, 1800], ["Média", "Mediana", "Moda", "Amplitude"], 1, "ROL: 1500, 1700, 1800, 1900, 25000. A mediana representa melhor o salário típico."], ["DESAFIO FINAL", [35, 5, 4, 3, 5, 6, 4, 5], ["Média", "Mediana", "Moda", "Nenhuma"], 1, "ROL: 3, 4, 4, 5, 5, 5, 6, 35. A mediana = 5 e resiste ao extremo 35."]];
const info=[
{t:'intro',tag:'AULA • MEDIDAS DE TENDÊNCIA CENTRAL',h:'Primeiro organize. Depois calcule.',p:'Em todos os exercícios você vai montar o <strong>ROL crescente</strong> arrastando os cartões. Só depois a pergunta de média, moda ou mediana será liberada.'},
{t:'copy',tag:'📓 COPIE NO CADERNO',h:'O que é ROL?',body:['<strong>ROL</strong> é a sequência dos dados colocados em ordem.','Nesta aula, usaremos <strong>ordem crescente</strong>: do menor para o maior.','Exemplo: 8, 3, 5, 2, 5 → <strong>2, 3, 5, 5, 8</strong>'],why:'A <strong>mediana depende da posição</strong>, por isso ordenar é obrigatório. O ROL também facilita enxergar a moda e organiza o cálculo da média.'},
{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Mediana, Moda e Média',body:['<strong>Mediana:</strong> valor central do ROL.','<strong>Moda:</strong> valor que mais se repete.','<strong>Média:</strong> soma de todos os valores ÷ quantidade de valores.'],why:'Sequência de trabalho: <strong>1) monte o ROL; 2) identifique mediana e moda; 3) calcule a média.</strong>'}
];
let score=0,current=0;const answered=Array(Q.length).fill(false),slides=document.getElementById('slides'),prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),scoreText=document.getElementById('scoreText');
function introHTML(v,i){let b=`<div class="tag ${v.t==='copy'?'copytag':''}">${v.tag}</div><h1>${v.h}</h1>`;if(v.p)b+=`<p class="lead">${v.p}</p>`;if(v.body)b+=`<div class="notebook">${v.body.map(x=>`<p>${x}</p>`).join('')}</div>`;if(v.why)b+=`<div class="why">${v.why}</div>`;if(v.t==='intro')b+=`<div class="cards"><div class="card"><em>1</em><b>ARRASTE</b><small>monte o ROL</small></div><div class="card"><em>2</em><b>CONFIRA</b><small>valide a ordem</small></div><div class="card"><em>3</em><b>CALCULE</b><small>tendência central</small></div><div class="card"><em>4</em><b>EXPLIQUE</b><small>entenda o resultado</small></div></div>`;return `<section class="slide ${i===0?'on':''}" data-slide="${i}">${b}</section>`}
function qHTML(q,qi,si){const [topic,vals,ans,corr,exp]=q;return `<section class="slide" data-slide="${si}" data-q="${qi}"><div class="tag">EXERCÍCIO ${qi+1}/10 • ${topic}</div><h2>1º monte o ROL crescente</h2><div class="sortwrap"><div class="sortlabel">Arraste os cartões para colocar do menor para o maior</div><div class="sortzone" aria-label="Área de ordenação">${vals.map((v,k)=>`<button type="button" class="tile" data-id="${k}" aria-label="Valor ${v}">${v}</button>`).join('')}</div><div class="sorthelp">No celular/iPad: arraste ou toque em dois cartões para trocar de posição.</div><div class="checkrow"><button type="button" class="checkbtn">Conferir ROL</button><button type="button" class="resetbtn">Embaralhar novamente</button></div></div><div class="feedback">Monte o ROL antes de responder.</div><div class="answers">${ans.map((a,k)=>`<button type="button" data-a="${k}" disabled>${a}</button>`).join('')}</div></section>`}
function build(){let h=info.map((v,i)=>introHTML(v,i)).join('');h+=Q.map((q,qi)=>qHTML(q,qi,qi+info.length)).join('');h+=`<section class="slide" data-slide="${Q.length+info.length}"><div class="tag">FECHAMENTO</div><h1>ROL primeiro. Tendência central depois.</h1><div class="steps"><div><em>1</em><b>ROL</b><small>ordene</small></div><div><em>2</em><b>MEDIANA</b><small>centro</small></div><div><em>3</em><b>MODA</b><small>frequência</small></div><div><em>4</em><b>MÉDIA</b><small>equilíbrio</small></div></div><div class="callout">Acertos: <strong id="finalScore">${score}/10</strong></div></section>`;slides.innerHTML=h;initQs();show(0)}
function currentOrder(zone){return [...zone.querySelectorAll('.tile')].map(b=>Number(b.textContent))}
function isSorted(a){return a.every((v,i)=>i===0||a[i-1]<=v)}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initQs(){document.querySelectorAll('[data-q]').forEach(sec=>{const qi=Number(sec.dataset.q),zone=sec.querySelector('.sortzone'),fb=sec.querySelector('.feedback'),checks=sec.querySelector('.checkbtn'),reset=sec.querySelector('.resetbtn'),ans=[...sec.querySelectorAll('.answers button')];let selected=null,drag=null;
function unlock(){zone.querySelectorAll('.tile').forEach(t=>t.classList.add('locked'));ans.forEach(b=>b.disabled=false);fb.className='feedback good';fb.innerHTML='✅ <strong>ROL correto!</strong> Agora responda a questão.'}
function swap(a,b){if(a===b)return;const ph=document.createElement('span');a.replaceWith(ph);b.replaceWith(a);ph.replaceWith(b)}
zone.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||t.classList.contains('locked'))return;drag=t;t.setPointerCapture?.(e.pointerId);t.classList.add('dragging')});
zone.addEventListener('pointermove',e=>{if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(el&&el!==drag&&zone.contains(el)){const r=el.getBoundingClientRect();if(e.clientX<r.left+r.width/2)zone.insertBefore(drag,el);else zone.insertBefore(drag,el.nextSibling)}});
zone.addEventListener('pointerup',e=>{if(drag){drag.classList.remove('dragging');drag=null}});
zone.addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t||t.classList.contains('locked'))return;if(!selected){selected=t;t.classList.add('selected')}else{selected.classList.remove('selected');if(selected!==t)swap(selected,t);selected=null}});
checks.onclick=()=>{if(isSorted(currentOrder(zone)))unlock();else{fb.className='feedback bad';fb.innerHTML='❌ Ainda não está em ordem crescente. Continue arrastando os cartões.'}};
reset.onclick=()=>{ans.forEach(b=>{b.disabled=true;b.classList.remove('correct','wrong')});fb.className='feedback';fb.textContent='Monte o ROL antes de responder.';const tiles=[...zone.children];shuffle(tiles).forEach(t=>{t.classList.remove('locked','selected','dragging');zone.appendChild(t)});selected=null};
ans.forEach((b,k)=>b.onclick=()=>{ans.forEach(x=>x.classList.remove('correct','wrong'));const corr=Q[qi][3],exp=Q[qi][4];if(k===corr){b.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <strong>Correto!</strong> '+exp;if(!answered[qi]){answered[qi]=true;score++;scoreText.textContent=score+'/10'}}else{b.classList.add('wrong');fb.className='feedback bad';fb.innerHTML='💡 Revise o ROL e tente novamente.'}});
})}
function show(n){const all=[...document.querySelectorAll('.slide')];current=Math.max(0,Math.min(all.length-1,n));all.forEach((s,k)=>s.classList.toggle('on',k===current));prog.style.width=((current+1)/all.length*100)+'%';count.textContent=(current+1)+' / '+all.length;prev.disabled=current===0;next.textContent=current===all.length-1?'Recomeçar ↻':'Próximo →';const fs=document.getElementById('finalScore');if(fs)fs.textContent=score+'/10'}
prev.onclick=()=>show(current-1);next.onclick=()=>{const all=document.querySelectorAll('.slide');if(current===all.length-1){score=0;answered.fill(false);scoreText.textContent='0/10';build()}else show(current+1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});build();
</script></body></html>
