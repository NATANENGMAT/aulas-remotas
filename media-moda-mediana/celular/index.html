<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>Média, Moda e Mediana — Celular</title><style>:root{--v:#5b4df0;--b:#1597e5;--ink:#172033;--mut:#667085;--line:#dbe4ee;--g:#166534;--gb:#ecfdf3;--bad:#9a3412;--badb:#fff7ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#edf2f7;color:var(--ink);overflow:hidden}.app{position:relative;width:100vw;height:100svh;max-width:520px;margin:0 auto;background:#fff;overflow:hidden}.prog{position:absolute;top:0;left:0;right:0;height:7px;background:#e8eef5;z-index:9}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--b));width:5%;transition:.25s}.slide{position:absolute;inset:7px 0 9.2% 0;padding:4.8vh 5.2vw 2vh;display:none;flex-direction:column;justify-content:flex-start;gap:1vh;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(circle at 8% 6%,#5b4df015,transparent 25%),radial-gradient(circle at 95% 5%,#1597e512,transparent 23%),#fff}.slide.on{display:flex}.intro{justify-content:center}.tag{align-self:flex-start;padding:7px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:900;font-size:11px}.copy{background:#fff7df;color:#8a4f00}h1,h2{margin:0;letter-spacing:-.035em;line-height:1.04}h1{font-size:clamp(30px,9vw,44px)}h2{font-size:clamp(28px,8vw,40px)}.lead{margin:0;color:#4d5a70;font-size:clamp(17px,4.8vw,22px);line-height:1.42}.cards,.three,.steps{display:grid;gap:9px}.cards,.steps{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}.card,.concept,.steps>div{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 25px #1e293b0b;padding:11px}.card{text-align:center}.card em,.steps em{display:grid;place-items:center;margin:auto;width:34px;height:34px;border-radius:50%;background:#eef2ff;color:#4338ca;font-style:normal;font-weight:900}.card b,.steps b,.concept b{display:block;font-size:15px}.card small,.steps small{color:var(--mut);font-size:11px}.notebook{position:relative;padding:13px 14px;border:2px solid #f2d28e;border-radius:18px;background:#fffdf7}.notebook:before{content:"";position:absolute;inset:0;border-radius:16px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#447bb41c 32px);pointer-events:none}.notebook p{position:relative;z-index:1;margin:.45em 0;font-size:15px;line-height:1.45}.why,.call{padding:11px 12px;border-left:5px solid var(--b);border-radius:14px;background:#f0f9ff;font-size:14px;line-height:1.4}.dataset{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin:.7vh 0}.dataset span{display:grid;place-items:center;min-width:48px;padding:10px 11px;border:2px solid var(--line);border-radius:15px;background:#fff;font-weight:900;font-size:22px}.dataset.sorted span{background:#f8fafc}.dataset .focus{background:#eaf7ff;border-color:#38bdf8;color:#075985}.dataset .danger{background:#fff1f2;border-color:#fda4af;color:#be123c}.compare{display:grid;grid-template-columns:1fr;align-items:center;gap:5px;width:100%}.compare small{display:block;text-align:center;color:var(--mut);font-weight:900;font-size:11px}.arrow{font-size:26px;text-align:center;transform:rotate(90deg);color:var(--v);font-weight:900}.formula{padding:12px 13px;width:100%;border:1px solid #d8e2ff;border-radius:18px;background:linear-gradient(135deg,#eef2ff,#f0f9ff);text-align:center;color:#312e81;font-weight:900;font-size:21px}.note{text-align:center;font-size:17px;margin:0}.concept{display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;text-align:left;align-items:center}.concept>span{grid-row:1/3;font-size:28px}.concept p{margin:0;color:#536174;font-size:13px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.answers button{padding:12px 9px;min-height:52px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:850;font-size:14px}.answers button.correct{border-color:#86efac;background:var(--gb);color:var(--g)}.answers button.wrong{border-color:#fdba74;background:var(--badb);color:var(--bad)}.feedback{padding:11px 12px;width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;background:#f8fafc;color:#4d5a70;font-size:13px;line-height:1.4}.feedback.good{border-color:#bbf7d0;background:var(--gb);color:var(--g)}.feedback.bad{border-color:#fed7aa;background:var(--badb);color:var(--bad)}.nav{position:absolute;left:0;right:0;bottom:0;height:9.2%;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-top:1px solid var(--line);background:#fffc}.nav button{padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:850;font-size:13px}.nav .next{background:var(--v);border-color:var(--v);color:#fff}.status{color:var(--mut);font-weight:800;font-size:11px;max-width:42vw;text-align:center}.status strong{color:var(--v)}.finalscore{text-align:center;padding:12px;width:100%;border:1px solid #c7d2fe;border-radius:18px;background:#eef2ff;color:#3730a3;font-weight:850;font-size:17px}@media(max-height:720px){.slide{padding-top:3.9vh}h1{font-size:31px}h2{font-size:28px}.lead{font-size:16px}.dataset span{padding:8px 9px;font-size:19px;min-width:43px}.answers button{padding:9px 7px;min-height:44px;font-size:13px}.notebook p{font-size:14px}.why,.call{font-size:13px;padding:9px 10px}}</style></head><body><div class="app"><div class="prog"><i id="prog"></i></div><main id="slides"></main><nav class="nav"><button id="prev">← Voltar</button><div class="status"><span id="count"></span> • <strong id="score">0/10</strong></div><button id="next" class="next">Próximo →</button></nav></div><script>const S=[{t:'intro',tag:'AULA • MEDIDAS DE TENDÊNCIA CENTRAL',h:'Antes da média, moda e mediana: organize os dados.',p:'Primeiro fazemos o <strong>ROL</strong>: colocamos os dados em ordem crescente.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'O que é ROL?',body:['<strong>ROL</strong> é a sequência dos dados colocados em ordem.','Usaremos <strong>ordem crescente</strong>: do menor para o maior.','Dados: 8, 3, 5, 2, 5 → <strong>ROL: 2, 3, 5, 5, 8</strong>'],why:'<strong>Por que fazer o ROL primeiro?</strong> A mediana depende da posição dos valores. Sem ordenar, podemos escolher o meio errado. O ROL também ajuda a visualizar repetições e a moda.'},{t:'visual',tag:'VISUALIZAÇÃO • ROL',h:'Dos dados brutos ao ROL',raw:[8,3,5,2,5],sorted:[2,3,5,5,8],call:'<strong>Regra de ouro:</strong> antes da mediana, coloque os dados em ordem crescente.'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Mediana',body:['<strong>Mediana</strong> é o valor que fica no centro do <strong>ROL</strong>.','Quantidade ímpar: um valor central.','Quantidade par: média dos dois valores centrais.'],data:[2,3,5,6,9],focus:[2],note:'Mediana = <strong>5</strong>'},{t:'example',tag:'EXEMPLO • MEDIANA PAR',h:'Dois valores no centro',data:[2,4,5,8],focus:[1,2],formula:'(4 + 5) ÷ 2 = <strong>4,5</strong>',note:'Mediana = <strong>4,5</strong>'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Moda',body:['<strong>Moda</strong> é o valor que aparece com maior frequência.','Pode haver uma moda, duas ou mais, ou nenhuma.'],data:[2,4,4,4,5,7],focus:[1,2,3],note:'Moda = <strong>4</strong>'},{t:'copy',tag:'📓 COPIE NO CADERNO',h:'Média aritmética',body:['<strong>Média</strong> é a soma dos valores dividida pela quantidade de valores.'],formula:'Média = soma ÷ quantidade',note:'3, 5, 7 → (3 + 5 + 7) ÷ 3 = <strong>5</strong>',why:'A ordem não muda a média, mas fazer o ROL primeiro organiza a análise.'},{t:'summary',tag:'📓 COPIE NO CADERNO',h:'Resumo',call:'<strong>Sequência:</strong> 1) ROL; 2) mediana e moda; 3) média.'},{t:'q',tag:'EXERCÍCIO 1/10 • ROL',h:'Qual é o ROL crescente?',data:[8,3,5,2,5],a:['8, 5, 5, 3, 2','2, 3, 5, 5, 8','2, 5, 3, 5, 8','3, 2, 5, 5, 8'],c:1,x:'ROL: 2, 3, 5, 5, 8.'},{t:'q',tag:'EXERCÍCIO 2/10 • MEDIANA',h:'Qual é a mediana?',data:[9,1,7,4,6],a:['4','5','6','7'],c:2,x:'ROL: 1, 4, 6, 7, 9. Centro = 6.'},{t:'q',tag:'EXERCÍCIO 3/10 • MEDIANA',h:'Quantidade par: qual é a mediana?',data:[2,4,6,10],sorted:1,a:['4','5','6','8'],c:1,x:'(4+6)÷2=5.'},{t:'q',tag:'EXERCÍCIO 4/10 • MODA',h:'Qual é a moda?',data:[2,3,7,7,7,9],sorted:1,a:['3','6','7','9'],c:2,x:'7 aparece 3 vezes.'},{t:'q',tag:'EXERCÍCIO 5/10 • MODA',h:'Qual alternativa está correta?',data:[2,2,5,5,8],sorted:1,a:['Moda = 2','Moda = 5','Não há moda','Modas = 2 e 5'],c:3,x:'2 e 5 são as modas.'},{t:'q',tag:'EXERCÍCIO 6/10 • MÉDIA',h:'Qual é a média?',data:[4,6,8,10],a:['6','6,5','7','8'],c:2,x:'28÷4=7.'},{t:'q',tag:'EXERCÍCIO 7/10 • AS TRÊS',h:'Qual trio está correto?',data:[2,3,3,4,8],sorted:1,a:['M 3 • Md 3 • Mo 4','M 4 • Md 4 • Mo 3','M 3 • Md 4 • Mo 3','M 4 • Md 3 • Mo 3'],c:3,x:'Média 4; mediana 3; moda 3.'},{t:'q',tag:'EXERCÍCIO 8/10 • EXTREMO',h:'Qual medida é mais afetada pelo 50?',data:[4,5,5,6,50],sorted:1,danger:[4],a:['Média','Mediana','Moda','Todas'],c:0,x:'A média é puxada pelo 50.'},{t:'q',tag:'EXERCÍCIO 9/10 • APLICAÇÃO',h:'Qual representa melhor o salário típico?',data:[1500,1700,1800,1900,25000],sorted:1,danger:[4],a:['Média','Mediana','Moda','Amplitude'],c:1,x:'A mediana resiste ao valor extremo.'},{t:'q',tag:'EXERCÍCIO 10/10 • DESAFIO',h:'Qual representa melhor o centro típico?',data:[3,4,4,5,5,5,6,35],sorted:1,danger:[7],a:['Média','Mediana','Moda','Nenhuma'],c:1,x:'A mediana é 5 e resiste ao 35.'},{t:'final',tag:'FECHAMENTO',h:'ROL → Mediana e Moda → Média'}];const el=document.getElementById('slides'),prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),scoreEl=document.getElementById('score');let i=0,score=0;const done=Array(S.length).fill(0);function ds(v){return '<div class="dataset '+(v.sorted?'sorted':'')+'">'+v.data.map((n,k)=>'<span class="'+(v.focus?.includes(k)?'focus ':'')+(v.danger?.includes(k)?'danger':'')+'">'+n+'</span>').join('')+'</div>'}function html(v,n){let c='<div class="tag '+(v.t==='copy'?'copy':'')+'">'+v.tag+'</div><h2>'+v.h+'</h2>';if(v.p)c+='<p class="lead">'+v.p+'</p>';if(v.t==='intro')c+='<div class="cards"><div class="card"><em>1</em><b>ROL</b><small>ordenar</small></div><div class="card"><em>2</em><b>MEDIANA</b><small>centro</small></div><div class="card"><em>3</em><b>MODA</b><small>frequente</small></div><div class="card"><em>4</em><b>MÉDIA</b><small>equilíbrio</small></div></div>';if(v.body)c+='<div class="notebook">'+v.body.map(x=>'<p>'+x+'</p>').join('')+'</div>';if(v.raw)c+='<div class="compare"><div><small>DADOS BRUTOS</small>'+ds({data:v.raw})+'</div><div class="arrow">→</div><div><small>ROL CRESCENTE</small>'+ds({data:v.sorted,sorted:1})+'</div></div>';if(v.data)c+=ds(v);if(v.formula)c+='<div class="formula">'+v.formula+'</div>';if(v.note)c+='<p class="note">'+v.note+'</p>';if(v.why)c+='<div class="why">'+v.why+'</div>';if(v.call)c+='<div class="call">'+v.call+'</div>';if(v.t==='summary')c+='<div class="three"><div class="concept"><span>⚖️</span><b>MÉDIA</b><p>Soma ÷ quantidade.</p></div><div class="concept"><span>🎯</span><b>MEDIANA</b><p>Centro do ROL.</p></div><div class="concept"><span>🔥</span><b>MODA</b><p>Mais frequente.</p></div></div>';if(v.t==='q')c+='<div class="answers">'+v.a.map((x,k)=>'<button data-k="'+k+'">'+x+'</button>').join('')+'</div><div class="feedback">Escolha uma alternativa.</div>';if(v.t==='final')c+='<div class="steps"><div><em>1</em><b>ROL</b><small>ordene</small></div><div><em>2</em><b>MEDIANA</b><small>centro</small></div><div><em>3</em><b>MODA</b><small>frequência</small></div><div><em>4</em><b>MÉDIA</b><small>calcule</small></div></div><div class="finalscore">Acertos: <strong id="finalScore">'+score+'/10</strong></div>';return '<section class="slide '+(n===0?'on':'')+'" data-n="'+n+'">'+c+'</section>'}function draw(){el.innerHTML=S.map(html).join('');document.querySelectorAll('.slide').forEach((s,n)=>{if(S[n].t==='q')s.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>answer(n,+b.dataset.k))});show(i)}function answer(n,k){const v=S[n],s=document.querySelector('.slide[data-n="'+n+'"]'),bs=[...s.querySelectorAll('.answers button')],fb=s.querySelector('.feedback');bs.forEach(b=>b.classList.remove('correct','wrong'));if(k===v.c){bs[k].classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ <strong>Correto!</strong> '+v.x;if(!done[n]){done[n]=1;score++;scoreEl.textContent=score+'/10'}}else{bs[k].classList.add('wrong');fb.className='feedback bad';fb.innerHTML='💡 <strong>Tente novamente.</strong> Faça o ROL e reveja a ideia.'}}function show(n){i=Math.max(0,Math.min(S.length-1,n));document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===i));prog.style.width=((i+1)/S.length*100)+'%';count.textContent=(i+1)+' / '+S.length;prev.disabled=i===0;next.textContent=i===S.length-1?'Recomeçar ↻':'Próximo →';const f=document.getElementById('finalScore');if(f)f.textContent=score+'/10'}prev.onclick=()=>show(i-1);next.onclick=()=>{if(i===S.length-1){i=0;score=0;done.fill(0);scoreEl.textContent='0/10';draw()}else show(i+1)};let x=null;addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>70)d<0?show(i+1):show(i-1);x=null},{passive:true});draw();</script></body></html>
